<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="For You · Rain Pages 个人文章" />
  <title>For You · Rain Pages</title>
  <script>try { if (localStorage.getItem('rainpages.theme.v1') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23bfdbfe'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(7 13) scale(.62)'/%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(56 55) scale(.42)'/%3E%3Cpath d='M50 4C34 24 18 42 18 62a32 32 0 0 0 64 0C82 42 66 24 50 4z' transform='translate(68 18) scale(.26)'/%3E%3C/g%3E%3Cellipse cx='30' cy='46' rx='4.5' ry='7' fill='%23ffffff' opacity='0.35'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #eff6fc;
      --panel: #ffffff;
      --ink: #0f2a44;
      --muted: #5a7d9a;
      --faint: #8dabc4;
      --line: #dcebf6;
      --accent: #2b8ad2;
      --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
        /* 夜间模式（与主页一致：白天 = 浅蓝，夜间 = 黑色风格） */
    html.dark {
      color-scheme: dark;
      --bg: #0a0f16;
      --panel: #0f1722;
      --ink: #e8eef5;
      --muted: #93a7ba;
      --faint: #5d7285;
      --line: #1d2937;
      --accent: #5fb2f2;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .topbar {
      flex: none;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }
    .brand-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
    .brand-sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .22em;
      color: var(--muted);
      margin-top: 3px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .theme-icon { width: 16px; height: 16px; }
    .theme-btn .theme-icon-sun { display: none; }
    html.dark .theme-btn .theme-icon-sun { display: block; }
    html.dark .theme-btn .theme-icon-moon { display: none; }
    .back-link {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }

    /* 内容区占满剩余可视高度，卡片垂直居中 */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    article {
      width: 100%;
      max-width: 920px;
      padding: 76px 84px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .meta {
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--muted);
      letter-spacing: .06em;
    }
    h1 {
      margin: 20px 0 40px;
      font-family: var(--serif);
      font-size: 56px;
      line-height: 1.25;
    }
    .body {
      font-family: var(--serif);
      font-size: 20px;
      line-height: 2;
      color: var(--muted);
    }

    /* 页脚固定在可视区域底部 */
    footer {
      flex: none;
      width: 100%;
      padding: 20px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      article { padding: 32px 22px; }
      h1 { font-size: 34px; }
      .body { font-size: 17px; }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">
      <span class="brand-dot"></span>
      <span>Rain Pages</span>
      <span class="brand-sub">PERSONAL ARCHIVE</span>
    </a>
    <div class="topbar-right">
      <a class="back-link" href="../../index.html">← 返回文章库</a>
      <button class="theme-btn" id="themeBtn" type="button" title="切换夜间模式" aria-label="切换夜间模式">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <article>
      <div class="meta">2026-08-26 · RAIN PAGES ARCHIVE</div>
      <h1>For You</h1>
      <div class="body">如你所见，这是一个类似博客的网站。起因是小资历喜欢显摆，所以心血来潮做了这个网站，它的作用就是充当个人博客，同时写一些杂乱无章的东西进来，后续可能会有其他内容更新，谁知道呢。也许4年后这个网站会变成现在我所不认识的样子吧。<br>时间是不会停下来的，我们只好走下去了。</div>
    </article>
  </main>

  <footer>
    <span>For wish, for blessing</span>
    <a href="../../index.html">回到文章库 ↑</a>
  </footer>
  <script>
    (function () {
      var btn = document.getElementById('themeBtn');
      if (!btn) return;
      function sync() {
        var dark = document.documentElement.classList.contains('dark');
        var tip = dark ? '切换白天模式' : '切换夜间模式';
        btn.title = tip;
        btn.setAttribute('aria-label', tip);
      }
      sync();
      btn.addEventListener('click', function () {
        var dark = !document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', dark);
        try { localStorage.setItem('rainpages.theme.v1', dark ? 'dark' : 'light'); } catch (e) {}
        sync();
      });
    })();
  </script>
</body>
</html>
